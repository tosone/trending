name: Deploy GitHub Trending

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: true # the fonts live in Git LFS; without them the site falls back to a system mono font

      - name: Validate data
        run: python3 tools/check.py

      - name: Prepare static site
        run: |
          mkdir -p .pages
          rsync -av --exclude='.git' --exclude='.github' --exclude='.pages' \
            --exclude='tools' --exclude='AGENTS.md' ./ .pages/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .pages

  github-pages-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
